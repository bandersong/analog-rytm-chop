[mod]
id      = "0001-chop"
title   = "CHOP: a second SAMPLE page that turns the twelve pads into sample-start markers"

# Off in the default build, which carries 0008 SMP CUT instead. The CHOP builds are
# `make samplefocus` (Sample Focus image A': 0000 0001; `make chop-min` is the same
# composition) and `make samplefocus-cut` (image B: 0000 0001 0008). The round-4
# `make chop` (0000 0001 0002 0003) is retired: CHOP's code now also lives in the parts
# of cave2 that 0002 and 0003 use. The id 0001 once
# belonged to a retracted MKII mod, 0001-microtiming-fine, which 0002 still
# excludes by that full id; it does not exist in this tree and the id strings
# differ, so nothing conflicts (see design.md).
enabled = false

# CHOP detours the same page hosts as 0004 LFO RND, so it can never be in one image
# with it. Since corp round 7 (D26/D27/D29) it shares an image with 0008 SMP CUT
# (image B, `make samplefocus-cut`): CHOP owns the page hosts and sends 0008's ids
# 1..2 and page 12 to 0008's shared_cut_* handlers, and the layout keeps the two
# apart, which layout.py checks (0008 is no longer excluded). CHOP's cave2 claims are
# 0002's and 0003's, so it excludes both (neither is in a Sample Focus image).
excludes = ["0002-euclid-accents", "0003-velocity-humanise", "0004-lfo-rnd"]

# re-only | built | hardware-verified | retracted
status  = "built"

summary = """
Sample Focus (image A' = image A minus STR, `make samplefocus`). On the SAMPLE view, press SAMPLE (let
go, pause, press again; not a quick double-tap, which is stock 1.73's sample-list
shortcut and stays stock) for the CHOP page: A PAD (1..12, the marker being
edited), B STA (0..120 with stock STA's resolution: fine steps under SAMPLE POS
RES = HI), C CHP (OFF/ON: right switches CHOP on for the track selected at that
moment), D END (a pad also sets the slice end), E DIV (1..12 equal slices), F LAY
(turn right: the slices go onto the EMPTY steps of the chop track's pattern), G RND
(turned while trig keys are held: each held step gets a random slice); H is blank
(image A's STR, an LFO stretch macro, was removed in round 7: it did not sweep on
hardware). The twelve markers start at 0, 10, 20 ... 110.

While CHOP is on, pad k sets the chop track's STA to marker k through the same
call a STA knob turn ends in - so under live REC stock records a normal trig with
a normal STA p-lock - and then plays the chop track as a normal pad hit would.
Pads do not switch track in CHOP. Hold trig key(s) of the chop track and hit pad
k: each held step gets an STA p-lock = marker k (stock's own held-trig path); the
base STA is then left alone.

Everything CHOP keeps lives in RAM only: a power cycle resets it and ends CHOP.
What it writes (STA/END p-locks, LAY's trigs, base STA/END values) is ordinary
stock data that plays on stock firmware. The round-4 page, pads, live-REC locks,
note-off pairing and step lock are confirmed on hardware (build a96657b4). Of Sample
Focus only image A's STR has a hardware report (it did not sweep, so round 7 removed
it); image A' and its rows (design.md H7-H11, H13, H14) have not run. Round 7 (D29)
also removed image A's STA dial graphic (the CHOP STA dial is id 4's own) to fit image B,
`make samplefocus-cut`: image A' plus 0008 SMP CUT, built, never run (design.md S1-S10).

Corp D41 (2026-10-09): a pad hit used to start near the PREVIOUS marker (the founder's
"hits land between markers, lock in after repeats"): the engine glides a sound parameter
written through param_set_value - STA and END among them - 3% of the way per audio-interrupt
run, and the pad's own trig is posted right after the write. chop_put now ends with chop_snap, which snaps the
chop track's STA and END (the smoother's state and the effective value the sample voices
read) to the value param_set_value has just written, exactly as the interrupt's lock pass
does for a sequencer p-lock. MK1 and MK2. Image A' (`make samplefocus`) is built with
0000-shared lean since D41, as image B is. Not yet run on hardware (design.md H-T1..H-T10).
"""

[sources]
stub = "stub.s"

[params]
# 1 = image B (`make samplefocus-cut`): 0000-shared is built with lean = 1, so its
# claim is the lean one at the end of its slot, and CHOP's .text claim runs on into
# the slot's head (registry, 0001-chop). It must match 0000-shared's lean: with lean = 0
# the two claims overlap and the build is refused; with lean = 1 and shared_lean = 0
# the head is simply unused. Since corp D41 (chop_snap) every CHOP target passes 1 with
# 0000-shared lean = 1 (`make samplefocus`, `make chop-min`, `make samplefocus-cut`, and
# MK2 always): CHOP's .text no longer fits the shared_lean = 0 claim (0x5b8), so a build
# left at this default is refused by build.py ("widen the claim"), never built short.
shared_lean = 0

[requires]
# MK2 (`make DEVICE=mk2 samplefocus|samplefocus-cut`, corp MK2 port): the same list from
# re/symbols_mk2.toml, minus the SAMPLE-key gate's (samp_key_resume, samp_key_to_base,
# page_cycle_arm, ev_is_down, ev_is_held, ev_bit4, weak_ptr_expired - no such gate on
# MK2), plus samp_draw_knobs and samp_draw_wave (the SAMP draw gate). The sound writes go
# through the active kit at project + 352 there (project_kit 0x400ae45e).
# CHOP calls shared_rnd (RND, knob G) and nothing else in 0000-shared; its sound
# writes go through the active kit at project + 232 (project_kit), never through
# 0000-shared's sound helpers. With 0008 as a provider it also jumps to 0008's
# shared_cut_* handlers (assembled only when build/shared.inc defines them).
# Corp D41 (chop_snap): ENG_TARGET, ENG_STATE, PARAMS_EFF and SND_CIDX_STA, the
# engine's per-track TARGET / smoother STATE / EFFECTIVE rows and STA's container index.
shared = true
symbols = [
  "page_info_resume",
  "page_get_value_body",
  "param_apply_delta_track",
  "param_value_text_args",
  "view_invalidate",
  "track_index_of",
  "project_singleton",
  "is_key_held",
  "project_kit",
  "kit_track_param_set",
  "param_set_value",
  "PARAM_ID_STA",
  "ui_pad_on_resume",
  "ui_pad_off_resume",
  "samp_key_resume",
  "samp_key_to_base",
  "page_cycle_arm",
  "ev_is_down",
  "ev_is_held",
  "ev_bit4",
  "weak_ptr_expired",
  "lock_delta_body",
  "press_lock_body",
  "ui_states",
  "hold_lock_source",
  "hold_any_in_length",
  "hold_set_edited",
  "hold_each_step",
  "hold_clear_actions",
  "project_selection",
  "param_info",
  "sample_pos_res",
  "sta_value_text",
  "param_tmpl_sta",
  "param_tmpl_default",
  "PARAM_INFO_BASE",
  "PARAM_INFO_STRIDE",
  "PARAM_ID_END",
  "shared_rnd",
  "current_track_pattern",
  "euclid_enabled_get",
  "pattern_length",
  "step_flag_test",
  "trig_create",
  "view_refresh_request",
  "ENG_TARGET",
  "ENG_STATE",
  "PARAMS_EFF",
  "SND_CIDX_STA",
]
